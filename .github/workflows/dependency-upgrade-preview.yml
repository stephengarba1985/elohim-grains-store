name: Dependency Upgrade Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade backend vulnerable dependencies
        working-directory: elohim-backend
        run: |
          npm install multer@^2.3.0 nodemailer@^9.1.0
          npm audit fix --package-lock-only
      - name: Upgrade frontend vulnerable dependencies
        working-directory: elohim-frontend
        run: |
          npm install next@^16.3.3
          npm audit fix --package-lock-only
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elohim-backend/package.json elohim-backend/package-lock.json elohim-frontend/package.json elohim-frontend/package-lock.json
          git diff --cached --quiet || git commit -m "fix: upgrade vulnerable npm dependencies"
          git push origin HEAD:fix/p0-cart-order-security
      - name: Capture upgraded manifests
        uses: actions/upload-artifact@v4
        with:
          name: upgraded-dependency-files
          path: |
            elohim-backend/package.json
            elohim-backend/package-lock.json
            elohim-frontend/package.json
            elohim-frontend/package-lock.json
